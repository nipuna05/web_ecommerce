# Local development: PostgreSQL + API.   Start:  docker compose up --build
# API:  http://localhost:4000/api/products
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ecommerce}
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DB_HOST: db
      DB_USER: ecommerce
      DB_PASSWORD: ${DB_PASSWORD:-ecommerce}
      DB_NAME: ecommerce
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
