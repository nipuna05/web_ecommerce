# Local development: PostgreSQL + API.   Start:  docker compose up --build
# Needs a .env file next to this one (copy .env.example). API: http://localhost:4000/api/products
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ecommerce}
      POSTGRES_DB: ecommerce
    ports:
      - "127.0.0.1:5432:5432" # reachable from this computer only
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DB_HOST: db
      DB_USER: ecommerce
      DB_PASSWORD: ${DB_PASSWORD:-ecommerce}
      DB_NAME: ecommerce
      CORS_ORIGIN: http://localhost:3000
      # Signs login tokens. Required: compose stops with a message if it is empty.
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (generate one with: openssl rand -hex 32)}
      # Optional: creates the first admin account on startup if both are set (password 8+ characters).
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
