# Render Blueprint: API + PostgreSQL.  Render dashboard -> New -> Blueprint -> pick this repo.
#
# WARNING (free plans): Render deletes a free PostgreSQL database 30 days after creation (14-day grace
# to upgrade) and does not back it up. Fine for a demo. For real data change `plan` to a paid one.
# Free web services also sleep when idle, so the first request after a while is slow.
databases:
  - name: ecommerce-db
    plan: free
    databaseName: ecommerce
    user: ecommerce

services:
  - type: web
    name: ecommerce-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/products
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # random, kept by Render
      - key: ADMIN_EMAIL # you type these in the Render dashboard; they are not stored in git
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        value: https://nipuna05.github.io
